packages:
  - "apps/*"
  - "packages/*"

# 이 프로젝트가 고정한 pnpm 10.12.1은 의존성 설치 스크립트를 기본 차단합니다.
# 해당 버전이 지원하는 허용 목록으로 Prisma 엔진, 비밀번호 해시 네이티브 모듈,
# Vite 번들러에 꼭 필요한 패키지만 실행해 공급망 위험과 운영 빌드 누락을 함께 막습니다.
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "bcrypt"
  - "esbuild"
  - "prisma"
